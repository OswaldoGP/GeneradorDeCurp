<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador y Generador de CURP</title>

    <!-- Rutas de estilos -->
    <link rel="stylesheet" href="public/css/b5.css">
    <link rel="stylesheet" href="public/css/main.css">

    <!-- Rutas de scripts base -->
    <script src="public/js/poper.js"></script>
    <script src="public/js/b5.js"></script>
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="">
                    <div class="">
                        <h3 class="mb-0 text-center">curp generador</h3>
                    </div>
                    <div class="card-body">
                        <form id="form-curp">
                            <div class="row g-3">
                                <div class="md-6">
                                    <label for="nombre" class="form-label">Nombre(s):</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre"
                                        required>
                                </div>
                                <div class="md-6">
                                    <label for="primer-apellido" class="form-label">Primer Apellido:</label>
                                    <input type="text" class="form-control" id="primer-apellido" placeholder="Ej. Pérez"
                                        required>
                                </div>
                                <div class="md-6">
                                    <label for="segundo-apellido" class="form-label">Segundo Apellido (Materno):</label>
                                    <input type="text" class="form-control" id="segundo-apellido"
                                        placeholder="Ej. López (opcional)">
                                </div>
                                <div class="md-6">
                                    <label for="fecha-nacimiento" class="form-label">Fecha de Nacimiento:</label>
                                    <input type="date" class="form-control" id="fecha-nacimiento" required>
                                </div>
                                <div class="md-6">
                                    <label for="sexo" class="form-label">Sexo:</label>
                                    <select class="form-select" id="sexo" required>
                                        <option value="">Seleccione...</option>
                                        <option value="H">Hombre</option>
                                        <option value="M">Mujer</option>
                                    </select>
                                </div>
                                <div class="md-6">
                                    <label for="estado" class="form-label">Entidad Federativa de Nacimiento:</label>
                                    <select class="form-select" id="estado" required>
                                        <option value="">Seleccione un estado...</option>
                                        <option value="AS">Aguascalientes</option>
                                        <option value="BC">Baja California</option>
                                        <option value="BS">Baja California Sur</option>
                                        <option value="CC">Campeche</option>
                                        <option value="CL">Coahuila</option>
                                        <option value="CM">Colima</option>
                                        <option value="CS">Chiapas</option>
                                        <option value="CH">Chihuahua</option>
                                        <option value="DF">Distrito Federal</option>
                                        <option value="DG">Durango</option>
                                        <option value="GT">Guanajuato</option>
                                        <option value="GR">Guerrero</option>
                                        <option value="HG">Hidalgo</option>
                                        <option value="JC">Jalisco</option>
                                        <option value="MC">México</option>
                                        <option value="MN">Michoacán</option>
                                        <option value="MS">Morelos</option>
                                        <option value="NT">Nayarit</option>
                                        <option value="NL">Nuevo León</option>
                                        <option value="OC">Oaxaca</option>
                                        <option value="PL">Puebla</option>
                                        <option value="QT">Querétaro</option>
                                        <option value="QR">Quintana Roo</option>
                                        <option value="SP">San Luis Potosí</option>
                                        <option value="SL">Sinaloa</option>
                                        <option value="SR">Sonora</option>
                                        <option value="TC">Tabasco</option>
                                        <option value="TS">Tamaulipas</option>
                                        <option value="TL">Tlaxcala</option>
                                        <option value="VZ">Veracruz</option>
                                        <option value="YN">Yucatán</option>
                                        <option value="ZS">Zacatecas</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mt-4 text-center">
                                <button type="button" id="btn-generar" class="btn btn-danger px-4">Generar</button>
                                <button type="reset" id="btn-limpiar" class="btn btn-secondary px-4">Limpiar</button>
                            </div>
                        </form>

                        <!-- Resultado -->
                        <div id="resultado" class="mt-4 d-none alert alert-info text-center">
                            <h5>CURP Generada:</h5>
                            <span id="curp-calculada" class="fs-4 fw-bold font-monospace"></span>
                            <div id="validacion-feedback" class="mt-2 small"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica de tu aplicación -->
    <script src="public/js/index.js"></script>
</body>

</html>
